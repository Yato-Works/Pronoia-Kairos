# Pronoia Kairos — Phase 0 Control Plane Prototype
# NVIDIA/GPU 依存なし。Python のみ。
#
# 注: GPU 実測 (M4, m4_realworld/) のみ torch + CUDA が必要。
#     CPU テストは既存の torch ビルドでも動作する (docs/REPRODUCE.md)。

[project]
name = "pronoia-kairos"
version = "0.1.0"
description = "Adaptive Inference Runtime — Semantic Demand as a shared coordination signal (research prototype)"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.5",
    "transformers>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
